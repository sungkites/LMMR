[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmmr"
version = "0.1.0"
description = "Source-consistent multigranular memory retrieval for small language model agents"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pengfeng Song"}, {name = "Yunkai Zhuang"}, {name = "Liye Shi"}]
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.4", "transformers>=4.51,<5", "tokenizers>=0.21", "safetensors>=0.4"]

[project.scripts]
lmmr-retrieve = "lmmr.cli:retrieve"
lmmr-evaluate = "lmmr.cli:evaluate"
lmmr-train = "lmmr.cli:train"

[tool.setuptools.packages.find]
where = ["src"]
